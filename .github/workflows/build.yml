name: Build PDD Coupon Hunter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      GRADLE_VERSION: 8.9

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Android SDK
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends wget unzip > /dev/null
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 安装 Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> $GITHUB_PATH

      - name: 准备签名密钥
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/release.jks \
            -alias pddhunter \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass pddhunter2026 -keypass pddhunter2026 \
            -dname "CN=PddHunter, OU=Kaisheng, O=Kaisheng, L=Shantou, ST=Guangdong, C=CN"

      - name: 创建 Xposed API stub
        run: |
          mkdir -p app/libs
          # 生成 Xposed API stub jar
          cat > /tmp/XposedStub.java << 'JAVAEOF'
          package de.robv.android.xposed;
          public interface IXposedHookLoadPackage extends IXposedMod {
              void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpparam) throws Throwable;
          }
          interface IXposedMod {}
          class XC_LoadPackage extends XCallback {
              public static class LoadPackageParam {
                  public String packageName; public String processName;
                  public ClassLoader classLoader; public boolean isFirstApplication;
              }
          }
          abstract class XCallback {
              public int priority = PRIORITY_DEFAULT;
              public static final int PRIORITY_DEFAULT = 50;
              public static final int PRIORITY_HIGHEST = 10000;
              public static final int PRIORITY_LOWEST = -10000;
              public static class Param { public Object[] args; public Object result; public Throwable throwable; }
              public static class MethodHookParam extends Param {
                  public Object thisObject;
                  public Object getResult() { return result; }
                  public void setResult(Object r) { this.result = r; }
              }
          }
          class XposedBridge {
              public static void hookMethod(Object m, XC_MethodHook c) {}
              public static void log(String t) { System.out.println("Xposed: "+t); }
          }
          class XposedHelpers {
              public static Class<?> findClass(String n, ClassLoader cl) { try { return Class.forName(n,false,cl); } catch(Exception e) { return null; } }
              public static Object callMethod(Object o, String m, Object... a) { return null; }
              public static void findAndHookMethod(String c, ClassLoader cl, String m, Object... p) {}
              public static void findAndHookMethod(Class<?> c, String m, Object... p) {}
          }
          class XC_MethodHook extends XCallback {
              protected void beforeHookedMethod(XC_MethodHook.MethodHookParam p) throws Throwable {}
              protected void afterHookedMethod(XC_MethodHook.MethodHookParam p) throws Throwable {}
          }
          JAVAEOF
          # 生成 callbacks 包
          cat > /tmp/XCCallbacks.java << 'JAVAEOF'
          package de.robv.android.xposed.callbacks;
          import de.robv.android.xposed.XCallback;
          public class XC_LoadPackage extends XCallback {
              public static class LoadPackageParam {
                  public String packageName; public String processName;
                  public ClassLoader classLoader; public boolean isFirstApplication;
              }
              public XC_LoadPackage() { super(); }
              public XC_LoadPackage(int priority) { super(priority); }
          }
          JAVAEOF
          # 编译并打包
          cd /tmp && mkdir -p xposed-out
          javac -d xposed-out XposedStub.java XCCallbacks.java
          cd xposed-out && jar cf /tmp/xposed-api-82.jar de/
          cp /tmp/xposed-api-82.jar "$GITHUB_WORKSPACE/app/libs/"
          ls -la "$GITHUB_WORKSPACE/app/libs/"

      - name: 编译 APK
        run: |
          echo "=== 开始编译 ==="
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | head -200
          echo "=== 编译结果 ==="
          find app/build -name "*.apk" 2>/dev/null
          ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "无release输出"
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "无debug输出"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: pdd-coupon-hunter-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: 上传 Debug APK
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: pdd-coupon-hunter-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
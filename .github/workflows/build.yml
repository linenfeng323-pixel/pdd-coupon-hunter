name: Build PDD Coupon Hunter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      GRADLE_VERSION: 8.9

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Android SDK
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends wget unzip > /dev/null
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1

      - name: 安装 Gradle 和 JDK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> $GITHUB_PATH

      - name: 编译 Xposed 存根库
        run: |
          mkdir -p app/libs
          # 编译所有存根
          find xposed-stub -name "*.java" > /tmp/xposed-sources.txt
          javac -d /tmp/xposed-stub-out @/tmp/xposed-sources.txt
          cd /tmp/xposed-stub-out
          jar cf "$GITHUB_WORKSPACE/app/libs/xposed-api-82.jar" .
          ls -la "$GITHUB_WORKSPACE/app/libs/"

      - name: 准备签名密钥
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/release.jks \
            -alias pddhunter \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass pddhunter2026 -keypass pddhunter2026 \
            -dname "CN=PddHunter, OU=Kaisheng, O=Kaisheng, L=Shantou, ST=Guangdong, C=CN"

      - name: 编译 APK
        run: |
          export GRADLE_OPTS="-Dorg.gradle.daemon=false"
          gradle assembleRelease --no-daemon --stacktrace 2>&1 || true
          echo "=== EXIT CODE: $? ==="

      - name: 列出 APK 输出
        run: |
          find app/build/outputs -name "*.apk" -type f 2>/dev/null || echo "No APK found"

      - name: 上传 APK 安装包
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pdd-coupon-hunter-apk
          path: app/build/outputs/apk/release/*.apk

      - name: 上传 debug APK
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: pdd-coupon-hunter-debug-apk
          path: app/build/outputs/apk/debug/*.apk